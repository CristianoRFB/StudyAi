name: StudyAI checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py interface.py build.py
  cloudflare-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check published interface and API without secrets
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://studyai-rfb.on7.workers.dev/ | grep -q 'StudyAI'
          curl --fail --silent --show-error --max-time 20 \
            -H 'content-type: application/json' \
            --data '{"question":"Qual é o prazo da apresentação?"}' \
            https://studyai-rfb.on7.workers.dev/api/ask \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("sources"), d; assert d.get("answer"), d; print("Cloudflare API smoke: PASS")'
